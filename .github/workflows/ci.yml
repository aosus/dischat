name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: docker/setup-buildx-action@v3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest --cov=src --cov-report=term-missing
      - run: uv run mkdocs build --strict
      - run: uv build
      - name: Verify wheel contains SQL migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          migration_dir = Path("src/dischat/storage/migrations")
          required = {
              f"dischat/storage/migrations/{path.name}"
              for path in migration_dir.glob("*.sql")
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing migrations: {sorted(missing)}")
          PY
      - run: docker build -t dischat:ci .

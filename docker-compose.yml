services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dischat
      POSTGRES_USER: dischat_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      DISCHAT_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-runtime-user.sh:/docker-entrypoint-initdb.d/10-runtime-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dischat_admin -d dischat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  db-bootstrap:
    image: postgres:17
    environment:
      PGHOST: postgres
      PGDATABASE: dischat
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      DISCHAT_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DISCHAT_LEGACY_DB_PASSWORD: ${POSTGRES_LEGACY_PASSWORD:-}
    volumes:
      - type: bind
        source: ./docker/postgres/ensure-runtime-user.sh
        target: /usr/local/bin/ensure-runtime-user.sh
        read_only: true
        bind:
          create_host_path: false
    command: ["/bin/sh", "/usr/local/bin/ensure-runtime-user.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  dischat:
    build: .
    env_file:
      - .env
    environment:
      # `.env` is also Compose's interpolation source for the bootstrap DB.
      # Never expose the PostgreSQL superuser password to the application.
      POSTGRES_ADMIN_PASSWORD: ""
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dischat
      POSTGRES_USER: dischat
      # Required. Copied .env.example provides the dev-only example value;
      # production MUST set a strong secret in .env before first startup.
      # Compose fails fast here if it is unset or empty.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - the 'dischat' example is dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dischat -d dischat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  dischat:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
